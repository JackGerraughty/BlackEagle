<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Awareness Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#ffffff;
    font-family:Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Widget */
.recaptcha{
    width:302px;
    height:78px;
    background:#f9f9f9;
    border:1px solid #d3d3d3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    box-sizing:border-box;
    cursor:pointer;
}

.left{
    display:flex;
    align-items:center;
}

.checkbox{
    width:28px;
    height:28px;
    border:2px solid #c1c1c1;
    background:white;
    border-radius:2px;
    position:relative;
    flex-shrink:0;
}

/* Checked state */
.checkbox.checked{
    border-color:#c1c1c1;
}

.checkbox.checked::after{
    content:"✓";
    position:absolute;
    left:3px;
    top:-7px;
    color:#34a853;
    font-size:36px;
    font-weight:400;
    line-height:28px;
}

.label{
    margin-left:12px;
    font-size:24px;
    color:#222;
    white-space:nowrap;
    line-height:1;
}


/* Right side */
.right{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:70px;
}

.logo{
    width:34px;
    height:34px;
    border-radius:50%;
    background:
        conic-gradient(
            #4285f4 0 120deg,
            #d9d9d9 120deg 240deg,
            #4285f4 240deg 360deg
        );
    position:relative;
}

.logo::before{
    content:"";
    position:absolute;
    inset:8px;
    background:#f9f9f9;
    border-radius:50%;
}

.rc-text{
    font-size:12px;
    color:#777;
    margin-top:6px;
}

.small{
    font-size:9px;
    color:#777;
    margin-top:2px;
}
</style>
</head>
<body>

<div class="recaptcha" id="widget">
    <div class="left">
        <div class="checkbox" id="checkbox"></div>
        <div class="label">I'm not a robot</div>
    </div>

    <div class="right">
        <div class="logo"></div>
        <div class="rc-text">reCAPTCHA</div>
        <div class="small">Privacy - Terms</div>
    </div>
</div>

<script>
const widget = document.getElementById('widget');
const checkbox = document.getElementById('checkbox');

widget.addEventListener('click', () => {
    checkbox.classList.add('checked');

    setTimeout(() => {
        alert(
            "SECURITY AWARENESS DEMO\n\n" +
            "This demonstrates how quickly a phishing interaction can occur.\n\n" +
            "No information was collected."
        );
    }, 500);
});
</script>

</body>
</html>
