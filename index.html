<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captcha Verification - Security Demo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

    body {
      background-color: #ffffff;
      font-family: "Inter", sans-serif;
    }

    .main {
      background-color: #f5f5f5;
      border: 1px solid #333;
      border-radius: 20px;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      padding: 20px;
      width: 300px;
      transform: translate(-50%, -50%);
      color: black;
      padding-top: 0px;
    }

    .center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .captcha {
      user-select: none;
      font-family: "Roboto", sans-serif;
      font-size: 15px;
      background-color: #F9F9F9;
      color: black;
      width: 200px;
      margin: auto;
      padding: 20px;
      border-radius: 3px;
      border: 1px solid #D3D3D3;
      display: flex;
      cursor: pointer;
      transition: 0.2s;
    }

    .captcha:hover {
      background-color: #e9e9e9;
    }

    .captcha button {
      display: block;
      margin-right: 10px;
      height: 24px;
      width: 24px;
      border: 1px solid #D3D3D3;
      background-color: #F9F9F9;
      cursor: pointer;
    }

    .captcha span {
      display: block;
      margin: 4px;
    }

    .captcha svg {
      margin-right: -5px;
      margin-left: auto;
      display: flex;
      height: 25px;
    }

    p {
      color: #aaa;
      text-align: center;
    }

    .warning-banner {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ff9800;
      color: #000;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      z-index: 999;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="center">
    <p>Please verify to get<br>access to the Content</p>
    <div class="captcha" onclick="showPwnedPopup()">
      <button id="verif-btn" type="button"> </button>
      <span>I'm not a Robot</span>
      <svg width="31" height="30" viewBox="0 0 31 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30.0906 14.9789C30.0899 14.7631 30.0849 14.5485 30.0753 14.335V2.15984L26.7093 5.52576C23.9545 2.15375 19.7637 0 15.0697 0C10.1847 0 5.84492 2.33169 3.10156 5.94269L8.61873 11.5179C9.15941 10.5179 9.92751 9.65906 10.8536 9.01039C11.8168 8.25873 13.1816 7.64415 15.0695 7.64415C15.2976 7.64415 15.4736 7.6708 15.603 7.72101C17.9421 7.90563 19.9696 9.19653 21.1635 11.0702L17.2581 14.9755C22.2047 14.9561 27.7928 14.9447 30.0902 14.978" fill="#1C3AA9"/>
        <path d="M14.9789 0.000610352C14.7631 0.00131601 14.5485 0.00633868 14.335 0.0159818H2.15983L5.52576 3.38191C2.15375 6.13673 0 10.3275 0 15.0216C0 19.9065 2.33173 24.2463 5.94269 26.9897L11.5179 21.4725C10.5179 20.9318 9.65906 20.1637 9.01039 19.2376C8.25877 18.2744 7.64415 16.9096 7.64415 15.0217C7.64415 14.7937 7.6708 14.6176 7.72101 14.4883C7.90563 12.1492 9.19653 10.1216 11.0702 8.92779L14.9755 12.8331C14.9561 7.88654 14.9447 2.29845 14.978 0.00103747" fill="#4285F4"/>
        <path d="M0 15.0211C0.00072284 15.2369 0.00569389 15.4514 0.0153656 15.665V27.8402L3.38129 24.4742C6.13611 27.8462 10.3269 30 15.021 30C19.9059 30 24.2457 27.6683 26.9891 24.0573L21.4719 18.4821C20.9312 19.4821 20.1631 20.3409 19.237 20.9896C18.2738 21.7413 16.909 22.3558 15.0211 22.3558C14.7931 22.3558 14.617 22.3292 14.4877 22.279C12.1486 22.0944 10.121 20.8035 8.92718 18.9298L12.8325 15.0245C7.88593 15.0439 2.29784 15.0553 0.000429605 15.022" fill="#ABABAB"/>
        </svg>
    </div>
  </div>


  <script>
    // Detect OS for educational display only
    function getOS() {
      const platform = window.navigator.platform;
      const macosPlatforms = ['Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'];
      const windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'];
      
      if (macosPlatforms.indexOf(platform) !== -1) return 'macOS';
      if (windowsPlatforms.indexOf(platform) !== -1) return 'Windows';
      return 'Your OS';
    }

    let verified = false;

    function showPwnedPopup() {
      if (verified) return;
      
      // Visual feedback on the checkbox
      const btn = document.getElementById("verif-btn");
      btn.style.backgroundColor = "#4CAF50";
      btn.innerHTML = "✓";
      btn.style.color = "white";
      btn.style.borderColor = "#4CAF50";
      btn.style.textAlign = "center";
      btn.style.lineHeight = "18px";
      
      // Harmless popup message
      const os = getOS();
      
      // Create modal overlay
      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.backgroundColor = 'rgba(0,0,0,0.85)';
      overlay.style.zIndex = '1000';
      overlay.style.display = 'flex';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.fontFamily = 'Inter, sans-serif';
      
      const modal = document.createElement('div');
      modal.style.backgroundColor = '#222';
      modal.style.border = '1px solid #f00';
      modal.style.borderRadius = '16px';
      modal.style.padding = '30px';
      modal.style.maxWidth = '400px';
      modal.style.textAlign = 'center';
      modal.style.boxShadow = '0 10px 40px rgba(0,0,0,0.5)';
      
      modal.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 16px;">💀</div>
        <h2 style="color: #ff4444; margin: 0 0 12px 0;">you got pwned</h2>
        <p style="color: #ccc; margin-bottom: 20px; line-height: 1.5;">
          This was a <strong style="color: #ffaa00;">security awareness demonstration</strong>.<br><br>
          In a real attack, clicking the CAPTCHA would have:<br>
          • Stolen your credentials<br>
          • Installed malware<br>
          • Given attackers access to your system<br><br>
          <span style="font-size: 12px; color: #888;">Detected OS: ${os}</span>
        </p>
        <button id="closeModalBtn" style="
          background-color: #ff4444;
          color: white;
          border: none;
          padding: 10px 24px;
          border-radius: 8px;
          font-size: 16px;
          cursor: pointer;
          font-weight: bold;
        ">Close — I understand</button>
        <div style="margin-top: 16px; font-size: 11px; color: #555;">
          This is an educational tool. No data was collected or transmitted.
        </div>
      `;
      
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      
      document.getElementById('closeModalBtn').addEventListener('click', function() {
        document.body.removeChild(overlay);
      });
      
      verified = true;
      
      // Also show browser's native alert for cross-platform visibility
      setTimeout(() => {
        if (confirm("⚠️ SECURITY DEMO\n\nThis is a simulated phishing attack.\n\nIn a real attack, you would be compromised right now.\n\nClick OK to acknowledge.")) {
          // Just closes the confirm
        }
      }, 100);
    }
  </script>
</body>
</html>
