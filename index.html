<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rnicrosoft.com</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#ffffff;
    font-family:Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Widget */
.recaptcha{
    width:302px;
    height:78px;
    background:#f9f9f9;
    border:1px solid #d3d3d3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    box-sizing:border-box;
    cursor:pointer;
}


/* Left section */
.verification-left{
    display:flex;
    align-items:center;
    gap:12px;
}

/* Checkbox */
.verification-checkbox{
    width:28px;
    height:28px;
    background:#fff;
    border:2px solid #c1c1c1;
    border-radius:2px;
    position:relative;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Checked state */
.verification-checkbox.checked::after{
    content:"✓";
    position:absolute;
    left:3px;
    top:-7px;
    color:#34a853;
    font-size:36px;
    font-weight:400;
    line-height:28px;
}

/* Label */
.verification-text{
    font-size:14px;
    color:#222;
    white-space:nowrap;
    line-height:1;
    user-select:none;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.loading-spinner{
    display:inline-block;
    width:16px;
    height:16px;
    border:2px solid #e0e0e0;
    border-top:2px solid #4285f4;
    border-radius:50%;
    animation:spin .8s linear infinite;
}



/* Checked state */
.checkbox.checked{
    border-color:#c1c1c1;
}



.label{
    margin-left:12px;
    font-size:14px;
    color:#222;
    white-space:nowrap;
    line-height:1;
}


/* Right side */
.right{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:70px;
}

.logo{
    width:34px;
    height:34px;
    border-radius:50%;
    background:
        conic-gradient(
            #4285f4 0 120deg,
            #d9d9d9 120deg 240deg,
            #4285f4 240deg 360deg
        );
    position:relative;
}

.logo::before{
    content:"";
    position:absolute;
    inset:8px;
    background:#f9f9f9;
    border-radius:50%;
}

.rc-text{
    font-size:10px;
    color:#555;
    margin-top:4px;
}

.small{
    font-size:8px;
    color:#777;
    margin-top:1px;
}
</style>
</head>
<body>

  <div class="recaptcha" id="widget">

    <!-- LEFT SIDE -->
    <div class="verification-left">
        <div class="verification-checkbox" id="checkbox"></div>
        <div class="verification-text label">
            I'm not a robot
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="logo"></div>
        <div class="rc-text">reCAPTCHA</div>
        <div class="small">Privacy · Terms</div>
    </div>

</div>

<script>
  let verified = false;
  
  const widget = document.getElementById('widget');
  const checkbox = document.getElementById('checkbox');
  const label = document.querySelector('.label');
  
  widget.addEventListener('click', () => {
  
      if (verified) return;
  
      checkbox.classList.add('checked');
  
      const originalLabel = label.innerHTML;
  
      label.innerHTML = `
          <span style="display:flex;align-items:center;gap:6px;">
              <span class="loading-spinner"></span>
              Verifying...
          </span>
      `;
  
      setTimeout(() => {
  
          label.innerHTML = originalLabel;
  
          const overlay = document.createElement('div');
  
          overlay.style.cssText = `
              position:fixed;
              inset:0;
              background:rgba(0,0,0,.82);
              display:flex;
              align-items:center;
              justify-content:center;
              z-index:9999;
              font-family:Roboto,sans-serif;
          `;
  
          const modal = document.createElement('div');
  
          modal.style.cssText = `
              background:#222;
              border:1px solid #ff4444;
              border-radius:14px;
              padding:28px;
              width:420px;
              text-align:center;
              color:white;
              box-shadow:0 10px 40px rgba(0,0,0,.5);
          `;
  
          modal.innerHTML = `
              <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
  
              <h2 style="margin:0 0 12px;color:#ff5555;">
                  Security Awareness Demonstration
              </h2>
  
              <p style="color:#ccc;line-height:1.5;margin-bottom:18px;">
                  This was a simulated interaction designed for awareness training.
                  <br><br>
                  Social engineering and deceptive prompts often rely on speed and familiarity.
                  <br><br>
                  No information was collected or transmitted.
              </p>
  
              <button id="closeBtn" style="
                  background:#ff4444;
                  color:white;
                  border:none;
                  padding:10px 24px;
                  border-radius:8px;
                  cursor:pointer;
                  font-size:15px;
              ">
                  Close
              </button>
  
              <div style="
                  margin-top:14px;
                  font-size:11px;
                  color:#777;
              ">
                  Educational demo only
              </div>
          `;
  
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
  
          document.getElementById('closeBtn')
              .addEventListener('click', () => overlay.remove());
  
          verified = true;
  
      }, 900);
  });
  </script>

</body>
</html>
