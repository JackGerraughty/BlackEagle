<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Verification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

    body {
      background-color: #111;
      font-family: "Roboto", sans-serif;
    }

    .main {
      user-select: none;
      border-radius: 3px;
      background-color: #F9F9F9;
      border: 1px solid #D3D3D3;
      margin: 0;
      position: absolute;
      top: 45%;
      left: 50%;
      padding: 0px;
      width: 290px;
      transform: translate(-50%, -50%);
      color: white;
      padding-top: 0px;
      height: 270px;
      z-index: 1;
    }

    h1 {
      border-radius: 3px;
      background-color: #1a73e8;
      margin: 5px;
      padding: 10px 16px;
      font-size: 28px;
    }

    ol {
      color: black;
    }

    li {
      margin-top: 12px;
    }

    .waiting {
      text-align: center;
      color: black;
      font-weight: 600;
      background-color: #F8F8F8;
      margin: 5px;
      margin-top: -1px;
      padding: 15px;
      padding-bottom: 85px;
      padding-top: 75px;
    }

    ol {
      background-color: #F8F8F8;
      border: 1px solid #D8D8D8;
      margin: 5px;
      padding: 20px 40px;
      padding-bottom: 35px;
      margin-bottom: 0px;
    }

    b {
      border-bottom: 1px solid #eee;
      padding: 3px 6px;
    }

  </style>
</head>
<body>
  <div class="main">
    <h1>Verification</h1>
    <div class="waiting">
    <span>Thank you for verifying,<br>You can close this Window now.</span>
    </div>
  </div>
</body>
</html>
